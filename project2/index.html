<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="2.css">
    <!-- <link rel = "stylesheet" href= "style.css" /> --> 
     <script src="3.js" defer></script>
    <title>Password Generator</title>
</head>
<body>
    <div class = "canvas">
        <h1>Password Generator</h1>
        <div class="container">
        <div class = "password-box">
            <input type= "text" id = "password" placeholder="Your password" readonly>
            <button id = "copyBtn">Copy</button>
            <button id="saveBtn" type="button">Save Password</button>
        </div>
   
        <div class="power-container">
            <div id="power-point"></div>
        </div>
             <div class="Strength-box">
<h5> password Strength</h5>
        </div>

        <div class="password-length-box">
            <label for="length"> Password length</label>
            <input type = "number" id = "length" value = "12"  min = "5" max = "120" >
        </div>

        <div class = "options">
            <label>
                <input type="checkbox" id = "uppercase" checked>Uppercase Letters (A-Z)
            </label>

            <label> 
                <input type="checkbox" id = "lowercase" checked> Lowercase Letters (a-z)
            </label>

            <label>
                <input type = "checkbox" id = "specialSymbol" checked> Special Symbol (@&!$)
            </label>

            <label> 
                <input type = "checkbox" id = "digits" checked> Digits (0-9)
            </label>

            <label>
                <input type = "checkbox" id = "customize"> customize your password
            </label>
        </div>
        <div class="customize" id="customize-container" style="display: none;">
            <input type="text" id="customize-password" placeholder="Write your preference" > Customize your password
        </div>

        <button id="generateBtn">Generate Password</button> 
        <p id="message"></p>
        <section id="saved-passwords-section">

    <h3>Saved Passwords</h3>

    <button id="deleteAllBtn" type="button">
        Delete All
    </button>

    <div id="savedPasswords">
        <!-- Saved passwords will appear here -->
    </div>

</section>
        </div>
    </div> 

</body>
</html>
